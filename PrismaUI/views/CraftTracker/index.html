<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Craft Tracker HUD</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: transparent;
    overflow: hidden;
    font-family: 'Futura Condensed', 'Cinzel', 'Trajan Pro', 'Segoe UI', -apple-system, sans-serif;
    color: #f1ede4;
}

/* Tracker container on HUD - Top Left corner */
#tracker-root {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.hidden {
    display: none !important;
}

/* Recipe Card - transparent glassmorphism */
.recipe-card {
    background-color: rgba(10, 14, 18, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 3px;
    padding: 6px 9px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.recipe-card.ready {
    background-color: rgba(14, 38, 22, 0.40);
    border-color: rgba(74, 222, 128, 0.55);
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.2), 0 4px 14px rgba(0, 0, 0, 0.4);
}

/* Card Header */
.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 4px;
}

.card-title-group {
    display: flex;
    align-items: baseline;
    gap: 6px;
    overflow: hidden;
}

.recipe-name {
    font-size: 14px;
    font-weight: bold;
    color: #f8fafc;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
}

.recipe-card.ready .recipe-name {
    color: #86efac;
}

.recipe-qty {
    font-size: 11px;
    color: #fbbf24;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
}

.batch-badge {
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 1px 4px;
    border-radius: 2px;
    background-color: rgba(234, 179, 8, 0.22);
    border: 1px solid rgba(234, 179, 8, 0.55);
    color: #fef08a;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
}

.hammer-icon {
    width: 20px;
    height: 20px;
    display: block;
    flex-shrink: 0;
    object-fit: contain;
}

.status-badge {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 1px 5px;
    border-radius: 2px;
    font-weight: bold;
    white-space: nowrap;
}

.status-badge.ready {
    background-color: rgba(20, 50, 30, 0.65);
    border: 1px solid rgba(74, 222, 128, 0.6);
    color: #86efac;
    text-shadow: 0 0 4px rgba(74, 222, 128, 0.6);
}

/* Ingredients List */
.ingredient-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.ingredient-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 2px;
    background-color: rgba(0, 0, 0, 0.20);
}

.ingredient-row.satisfied {
    background-color: rgba(34, 197, 94, 0.08);
}

.ing-left {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
}

.ing-icon {
    font-size: 10px;
    width: 11px;
    text-align: center;
    color: #fbbf24;
}

.ingredient-row.satisfied .ing-icon {
    color: #4ade80;
}

.ing-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #e2e8f0;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    max-width: 170px;
}

.ingredient-row.satisfied .ing-name {
    color: #94a3b8;
    text-decoration: line-through;
    opacity: 0.75;
}

.ing-counts {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
}

.ing-counts.missing {
    color: #f87171;
}

.ing-counts.ok {
    color: #4ade80;
}
</style>
</head>
<body>

<div id="tracker-root" class="hidden">
    <div id="recipes-container"></div>
</div>

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Update function called from C++
    window.updateTracker = function(data) {
        let recipes = data;
        if (typeof data === 'string') {
            try {
                recipes = JSON.parse(data);
            } catch (e) {
                console.error('Failed to parse tracker JSON:', e);
                return;
            }
        }

        if (!recipes || !Array.isArray(recipes) || recipes.length === 0) {
            rootEl.classList.add('hidden');
            containerEl.innerHTML = '';
            return;
        }

        rootEl.classList.remove('hidden');

        let html = '';
        for (let i = 0; i < recipes.length; i++) {
            const r = recipes[i];
            const isReady = !!r.isReady;
            const cardClass = isReady ? 'recipe-card ready' : 'recipe-card';

            const statusHtml = isReady
                ? '<span class="status-badge ready">&#10004; ГОТОВО</span>'
                : '<img src="' + HAMMER_B64 + '" class="hammer-icon" alt="В процессе" title="В процессе сбора">';

            const multHtml = (r.multiplier && r.multiplier > 1)
                ? '<span class="batch-badge">&times;' + r.multiplier + '</span>'
                : '';

            const qtyHtml = (r.countProduced && r.countProduced > 1)
                ? '<span class="recipe-qty">(' + (r.countProduced * (r.multiplier || 1)) + ' шт.)</span>'
                : '';

            html += '<div class="' + cardClass + '">';
            html += '  <div class="card-top">';
            html += '    <div class="card-title-group">';
            html += '      <span class="recipe-name" title="' + escapeHtml(r.itemName) + '">' + escapeHtml(r.itemName) + '</span>';
            html += multHtml;
            html += qtyHtml;
            html += '    </div>';
            html += statusHtml;
            html += '  </div>';

            html += '  <div class="ingredient-list">';
            if (r.ingredients && Array.isArray(r.ingredients)) {
                for (let j = 0; j < r.ingredients.length; j++) {
                    const ing = r.ingredients[j];
                    const satisfied = ing.missing === 0;
                    const rowClass = satisfied ? 'ingredient-row satisfied' : 'ingredient-row';
                    const iconHtml = satisfied ? '&#10004;' : '&#8226;';
                    const countClass = satisfied ? 'ing-counts ok' : 'ing-counts missing';

                    html += '    <div class="' + rowClass + '">';
                    html += '      <div class="ing-left">';
                    html += '        <span class="ing-icon">' + iconHtml + '</span>';
                    html += '        <span class="ing-name" title="' + escapeHtml(ing.name) + '">' + escapeHtml(ing.name) + '</span>';
                    html += '      </div>';
                    html += '      <span class="' + countClass + '">' + ing.have + ' / ' + ing.need + '</span>';
                    html += '    </div>';
                }
            }
            html += '  </div>';
            html += '</div>';
        }

        containerEl.innerHTML = html;
    };

    // Request actual state when loaded without any mock flash
    document.addEventListener('DOMContentLoaded', function() {
        if (window.CraftTracker_requestState) {
            window.CraftTracker_requestState('');
        }
    });
})();
</script>

</body>
</html>
