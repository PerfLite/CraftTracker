[General]
; DirectX scan code for Pin/Unpin hotkey in crafting menu (0x21 / 33 = F, 0x14 / 20 = T, 0x25 / 37 = K)
iHotkey = 33

; DirectX scan code for Toggle HUD on/off in gameplay (0x23 / 35 = H, 0 = disabled)
iToggleHudHotkey = 35

; Show HUD notification when recipe is pinned, unpinned, or ready
bShowNotifications = true

; Play sound on actions
bPlaySounds = true

; Auto hide widget when game menus/cutscenes hide HUD
bHideWhenHudHidden = true
